name: Python analysis checks

on:
  push:
    branches: [main, "ecommarket-quality-upgrade-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r python/requirements.txt
      - run: python -m compileall -q python
      - run: python -m unittest discover -s python/tests -v
      - run: python python/run_project.py
